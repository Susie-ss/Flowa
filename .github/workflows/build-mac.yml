name: Build macOS

on:
  push:
    branches: [main]
  workflow_dispatch:   # 允许手动触发

jobs:
  build-mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build macOS
        run: |
          cd AxurePlugin
          chmod +x build_mac.sh
          ./build_mac.sh

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-build
          path: AxurePlugin/dist/mac/
