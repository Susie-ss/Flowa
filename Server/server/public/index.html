<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Axure 预览文件管理平台</title>
  <link rel="icon" href="/favicon.png" />
  <link rel="stylesheet" href="/css/style.css?v=20260616f" />
  <link rel="stylesheet" href="/libs/phosphor/duotone/style.css" />
  <link rel="stylesheet" href="/libs/bi/bootstrap-icons.min.css" />
</head>
<body>
  <!-- ===== HEADER ===== -->
  <header id="header" style="display:none">
    <a class="logo" href="/">
      <div class="logo-icon"><img src="/favicon.png" style="width:24px;height:24px" /></div>
      <span class="logo-text">Framo</span>
      <span class="logo-badge">Beta</span>
    </a>
    <div class="header-right">
      <button class="btn btn-primary" onclick="showDownloadPluginModal()" style="display:flex;align-items:center;gap:6px">
        <svg class="icon-color icon-md"><use href="/libs/iconpark/icons.svg#ico-download"/></svg> 下载插件
      </button>
      <button class="notification-btn" id="notification-btn" title="通知" onclick="toggleNotificationPanel()">
        <span class="notification-icon"><svg class="icon-color icon-lg"><use href="/libs/iconpark/icons.svg#ico-bell"/></svg></span>
        <span class="notification-badge" id="notification-badge" style="display:none">0</span>
      </button>
      <div class="avatar" id="header-avatar" title="个人中心" onclick="toggleUserMenu()"></div>
    </div>
  </header>

  <!-- ===== AUTH CONTAINER (登录/注册/分享页) ===== -->
  <div id="auth-container"></div>

  <!-- ===== MAIN LAYOUT ===== -->
  <div class="layout" id="main-layout" style="display:none">
    <!-- SIDEBAR -->
    <aside id="sidebar">
      <div class="sidebar-section">
        <a class="sidebar-item" data-page="home" onclick="navigateTo('home')">
          <span class="icon"><svg class="sidebar-icon-color" viewBox="0 0 48 48"><path d="M24 6L6 22H12V40H22V30H26V40H36V22H42L24 6Z" fill="#5B5EF4"/><path d="M32 15V20" fill="none" stroke="#F59E0B" stroke-width="3.5" stroke-linecap="round"/><rect x="20" y="26" width="8" height="14" rx="3" fill="#A855F7"/><circle cx="24" cy="32" r="1.5" fill="#FDE68A"/></svg></span><span class="sidebar-text">首页</span>
        </a>
        <a class="sidebar-item" data-page="projects" onclick="navigateTo('projects')">
          <span class="icon"><svg class="sidebar-icon-color" viewBox="0 0 48 48"><path d="M6 10L20 6H30L28 12H42V40H6V10Z" fill="#5B5EF4"/><path d="M20 6L24 14L18 14Z" fill="#06B6D4"/><rect x="12" y="20" width="24" height="3" rx="1.5" fill="#FFFFFF" opacity="0.55"/><rect x="12" y="26" width="16" height="3" rx="1.5" fill="#FFFFFF" opacity="0.35"/><rect x="12" y="32" width="20" height="3" rx="1.5" fill="#22C55E" opacity="0.5"/></svg></span><span class="sidebar-text">项目</span>
        </a>
        <a class="sidebar-item" data-page="library" onclick="navigateTo('library')">
          <span class="icon"><svg class="sidebar-icon-color" viewBox="0 0 24 24" fill="none" stroke="#5B5EF4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg></span><span class="sidebar-text">组件库</span>
        </a>
        <a class="sidebar-item" data-page="ai-generate" onclick="navigateTo('ai-generate')">
          <span class="icon"><svg class="sidebar-icon-color" viewBox="0 0 24 24" fill="none" stroke="#5B5EF4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l1.5 3.5L17 8l-3.5 1.5L12 13l-1.5-3.5L7 8l3.5-1.5L12 3z"/><circle cx="18" cy="18" r="3" fill="#F59E0B" stroke="#F59E0B" stroke-width="1.5"/><path d="M18 16v4M16 18h4" stroke="#F59E0B" stroke-width="2"/></svg></span><span class="sidebar-text">AI生成</span>
        </a>
      </div>
      <!-- Tags Section -->
      <div style="padding:20px 12px 8px">
        <div style="display:flex;align-items:center;justify-content:space-between;padding:0 8px;margin-bottom:4px">
          <span class="sidebar-label" style="margin:0;padding:0">标签</span>
          <button onclick="showNewProductLineModal()" style="background:none;border:none;cursor:pointer;color:var(--text-muted);font-size:14px;padding:2px 4px;border-radius:4px" title="新建标签"><svg class="icon-color icon-md"><use href="/libs/iconpark/icons.svg#ico-plus-gray"/></svg></button>
        </div>
        <div id="sidebar-product-lines"></div>
      </div>
      <div class="sidebar-bottom">
        <a class="sidebar-item" onclick="toggleSidebar()">
          <span class="icon" id="sidebar-toggle-icon"><svg class="sidebar-icon-color"><use href="/libs/iconpark/icons.svg#ico-chevron-left"/></svg></span><span class="sidebar-text">收起</span>
        </a>
      </div>
    </aside>

    <!-- MAIN CONTENT -->
    <main id="main-content">
      <!-- Pages will be rendered here by router -->
    </main>
  </div>

  <!-- ===== MODALS ===== -->
  <!-- Login Modal -->
  <div class="modal-overlay" id="login-modal">
    <div class="modal">
      <div class="modal-header"><h3 style="margin:0">登录</h3><button class="modal-close-btn" onclick="hideModal('login-modal')"><svg class="iconpark iconpark-lg"><use href="/libs/iconpark/sprite.svg#close"/></svg></button></div>
      <div class="form-row">
        <label>用户名</label>
        <input type="text" id="login-username" placeholder="请输入用户名" />
      </div>
      <div class="form-row">
        <label>密码</label>
        <input type="password" id="login-password" placeholder="请输入密码" />
      </div>
      <div class="modal-actions">
        <button class="btn btn-ghost" onclick="hideModal('login-modal')">取消</button>
        <button class="btn btn-primary" onclick="doLogin()">登录</button>
      </div>
      <div style="text-align:center;margin-top:12px;font-size:13px;color:var(--text-secondary)">
        没有账号？<a href="/register" style="color:var(--primary);cursor:pointer">立即注册</a>
      </div>
    </div>
  </div>

  <!-- Register Modal -->
  <div class="modal-overlay" id="register-modal">
    <div class="modal">
      <div class="modal-header"><h3 style="margin:0">注册</h3><button class="modal-close-btn" onclick="hideModal('register-modal')"><svg class="iconpark iconpark-lg"><use href="/libs/iconpark/sprite.svg#close"/></svg></button></div>
      <div class="form-row">
        <label>用户名</label>
        <input type="text" id="register-username" placeholder="至少3位" />
      </div>
      <div class="form-row">
        <label>密码</label>
        <input type="password" id="register-password" placeholder="至少6位" />
      </div>
      <div class="modal-actions">
        <button class="btn btn-ghost" onclick="hideModal('register-modal')">取消</button>
        <button class="btn btn-primary" onclick="doRegister()">注册</button>
      </div>
      <div style="text-align:center;margin-top:12px;font-size:13px;color:var(--text-secondary)">
        已有账号？<a href="/login" style="color:var(--primary);cursor:pointer">立即登录</a>
      </div>
    </div>
  </div>

  <!-- New Tag Modal -->
  <div class="modal-overlay" id="new-product-line-modal">
    <div class="modal" style="width:440px">
      <div class="modal-header">
        <div>
          <div style="font-size:15px;font-weight:600">新建标签</div>
          <div style="font-size:12px;color:var(--text-muted);margin-top:2px">创建新的项目分类标签</div>
        </div>
        <button class="modal-close-btn" onclick="hideModal('new-product-line-modal')"><svg class="iconpark iconpark-lg"><use href="/libs/iconpark/sprite.svg#close"/></svg></button>
      </div>
      <div class="form-row">
        <label>标签名称 <span style="color:#EF4444">*</span></label>
        <input type="text" id="new-pl-name" placeholder="例如：营销活动、B端系统" />
      </div>
      <div class="form-row" style="margin-top:14px">
        <label>标识颜色</label>
        <div style="display:flex;gap:10px;margin-top:4px" id="pl-color-swatches">
          <div class="color-swatch selected" style="background:#5B5EF4" onclick="selectPLColor('#5B5EF4', this)"></div>
          <div class="color-swatch" style="background:#22C55E" onclick="selectPLColor('#22C55E', this)"></div>
          <div class="color-swatch" style="background:#F59E0B" onclick="selectPLColor('#F59E0B', this)"></div>
          <div class="color-swatch" style="background:#EF4444" onclick="selectPLColor('#EF4444', this)"></div>
          <div class="color-swatch" style="background:#A855F7" onclick="selectPLColor('#A855F7', this)"></div>
          <div class="color-swatch" style="background:#06B6D4" onclick="selectPLColor('#06B6D4', this)"></div>
          <div class="color-swatch" style="background:#8B5CF6" onclick="selectPLColor('#8B5CF6', this)"></div>
        </div>
        <input type="hidden" id="new-pl-color" value="#5B5EF4" />
      </div>
      <div class="modal-actions">
        <button class="btn btn-ghost" onclick="hideModal('new-product-line-modal')">取消</button>
        <button class="btn btn-primary" onclick="createProductLine()">创建</button>
      </div>
    </div>
  </div>

  <!-- New Project Modal -->
  <div class="modal-overlay" id="new-project-modal">
    <div class="modal" style="width:480px">
      <div class="modal-header">
        <div>
          <div style="font-size:15px;font-weight:600">新建项目</div>
          <div style="font-size:12px;color:var(--text-muted);margin-top:2px">创建一个新的原型设计项目</div>
        </div>
        <button class="modal-close-btn" onclick="hideModal('new-project-modal')"><svg class="iconpark iconpark-lg"><use href="/libs/iconpark/sprite.svg#close"/></svg></button>
      </div>
      <div class="form-row">
        <label>项目名称 <span style="color:#EF4444">*</span></label>
        <input type="text" id="new-project-name" placeholder="例如：首页重设计 v3" />
      </div>
      <div class="form-row" style="margin-top:14px">
        <label>卡片颜色</label>
        <div style="display:flex;gap:10px;margin-top:4px" id="proj-color-swatches">
          <div class="color-swatch selected" style="background:#5B5EF4" onclick="selectProjColor('#5B5EF4', this)"></div>
          <div class="color-swatch" style="background:#22C55E" onclick="selectProjColor('#22C55E', this)"></div>
          <div class="color-swatch" style="background:#F59E0B" onclick="selectProjColor('#F59E0B', this)"></div>
          <div class="color-swatch" style="background:#EF4444" onclick="selectProjColor('#EF4444', this)"></div>
          <div class="color-swatch" style="background:#A855F7" onclick="selectProjColor('#A855F7', this)"></div>
          <div class="color-swatch" style="background:#06B6D4" onclick="selectProjColor('#06B6D4', this)"></div>
          <div class="color-swatch" style="background:#8B5CF6" onclick="selectProjColor('#8B5CF6', this)"></div>
        </div>
        <input type="hidden" id="new-project-color" value="#5B5EF4" />
      </div>
      <div class="modal-actions">
        <button class="btn btn-ghost" onclick="hideModal('new-project-modal')">取消</button>
        <button class="btn btn-primary" onclick="createProject()">创建项目</button>
      </div>
    </div>
  </div>

  <!-- Toast -->
  <div class="toast" id="toast"></div>

  <!-- ===== SCRIPTS ===== -->
  <script src="/libs/split.min.js?v=20260527f"></script>
  <script src="/js/api.js?v=20260527f"></script>
  <script src="/js/viewer.js?v=20260528a"></script>
  <script src="/js/router.js?v=20260616a"></script>
  <script src="/js/modal.js?v=20260527k"></script>
  <script>
    // Static HTML modals — overlay click to close
    document.addEventListener('click', function(e) {
      if (e.target.classList.contains('modal-overlay') && e.target.classList.contains('active')) {
        e.target.classList.remove('active');
      }
    });
  </script>
  <script src="/js/app.js?v=20260528a"></script>
  <script src="/js/pages/auth.js?v=20260527f"></script>
  <script src="/js/pages/home.js?v=20260527m"></script>
  <script src="/js/pages/products.js?v=20260528a"></script>
  <script src="/js/pages/projects.js?v=20260528a"></script>
  <script src="/js/pages/library.js?v=20260616e"></script>
  <script src="/js/pages/ai-generate.js?v=20260616f"></script>
</body>
</html>
